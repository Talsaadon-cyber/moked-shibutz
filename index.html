<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#185FA5;--pd:#0C447C;--pl:#E6F1FB;--bg:#fff;--bg2:#f5f5f5;--tx:#1a1a1a;--tx2:#666;--tx3:#999;--br:rgba(0,0,0,0.1);--r:10px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;direction:rtl;background:var(--bg2);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{background:var(--p);color:#fff;padding:calc(12px + var(--st)) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hlogo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.htitle{font-size:16px;font-weight:600}
.hsub{font-size:11px;opacity:.8;margin-top:1px}
.hbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.content{flex:1;overflow-y:auto;padding:12px 14px;padding-bottom:calc(72px + var(--sb))}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:.5px solid var(--br);display:flex;padding-bottom:var(--sb);z-index:100}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;position:relative;color:var(--tx3);font-size:10px;gap:3px;border:none;background:transparent}
.bni i{font-size:22px}
.bni.on{color:var(--p)}
.bni.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--p);border-radius:0 0 2px 2px}
.nbadge{position:absolute;top:5px;left:calc(50% + 7px);background:#E24B4A;color:#fff;font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--bg);border-radius:var(--r);border:.5px solid var(--br);margin-bottom:10px;overflow:hidden}
.card-hdr{padding:11px 14px;border-bottom:.5px solid var(--br);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.metric{background:var(--bg);border-radius:var(--r);padding:11px 13px;border:.5px solid var(--br)}
.ml{font-size:11px;color:var(--tx2);margin-bottom:2px}
.mv{font-size:24px;font-weight:600}
.ms{font-size:11px;color:var(--tx3);margin-top:1px}
.ss{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:360px}
th{font-size:11px;font-weight:600;color:var(--tx2);padding:6px 5px;text-align:center;background:var(--bg2);border-bottom:.5px solid var(--br);white-space:nowrap}
td{padding:4px 4px;border-bottom:.5px solid var(--br);vertical-align:top;font-size:10px}
tr:last-child td{border-bottom:none}
.tag{display:inline-flex;padding:1px 4px;border-radius:3px;font-size:9px;margin:1px;white-space:nowrap}
.ty{background:#FFFF99;color:#633806}.tb{background:#B5D4F4;color:#042C53}.tp{background:#FFB3CC;color:#4B1528}.te{background:#EAF3DE;color:#173404}.ta{background:#B5D4F4;color:#0C447C;font-weight:600}
.srch{width:100%;padding:10px 13px;border:1px solid var(--br);border-radius:var(--r);font-size:14px;background:var(--bg);margin-bottom:10px;direction:rtl}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fsel{padding:6px 10px;border:1px solid var(--br);border-radius:8px;font-size:12px;background:var(--bg);direction:rtl}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcard{background:var(--bg);border-radius:var(--r);border:.5px solid var(--br);padding:11px}
.wct{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.wav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.wname{font-size:12px;font-weight:600}
.wrole{font-size:10px;color:var(--tx2)}
.wtype{font-size:10px;padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:6px}
.ws{display:flex;gap:3px}
.wst{flex:1;text-align:center;background:var(--bg2);border-radius:6px;padding:3px 2px}
.wsv{font-size:13px;font-weight:600}
.wsl{font-size:9px;color:var(--tx3)}
.ppick{width:100%;padding:10px 13px;border:1px solid var(--br);border-radius:var(--r);font-size:13px;background:var(--bg);margin-bottom:10px;direction:rtl}
.srow{display:flex;gap:9px;padding:10px 13px;border-bottom:.5px solid var(--br)}
.srow:last-child{border-bottom:none}
.sd8{width:36px;text-align:center;flex-shrink:0}
.sday{font-size:10px;color:var(--tx2)}
.snum{font-size:17px;font-weight:600;line-height:1}
.spill{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;align-self:center}
.si{flex:1;min-width:0}
.shrs{font-size:10px;color:var(--tx2);margin-bottom:2px}
.why{margin-top:3px;padding:4px 7px;border-radius:6px;font-size:11px;display:flex;gap:5px;line-height:1.4}
.why i{font-size:12px;flex-shrink:0;margin-top:1px}
.wr{background:#EAF3DE;color:#173404}.wa{background:#E6F1FB;color:#042C53}.ww{background:#FAEEDA;color:#412402}
.tabs{display:flex;border-bottom:.5px solid var(--br);overflow-x:auto}
.tab{flex-shrink:0;padding:10px 13px;font-size:12px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-.5px}
.tab.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
.fgroup{margin-bottom:11px}
.flbl{font-size:12px;color:var(--tx2);margin-bottom:4px;display:block}
.finp,.fsel2{width:100%;padding:10px 13px;border:1px solid var(--br);border-radius:var(--r);font-size:14px;background:var(--bg);direction:rtl}
.btnfull{width:100%;padding:12px;background:var(--p);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btnfull i{font-size:18px}
.aitem{display:flex;gap:10px;padding:11px 13px;border-bottom:.5px solid var(--br);align-items:flex-start}
.aitem:last-child{border-bottom:none}
.aitem i{font-size:19px;flex-shrink:0}
.atxt{font-size:13px;font-weight:500}
.asub{font-size:11px;color:var(--tx2);margin-top:2px}
.ardbtn{margin-top:5px;padding:4px 10px;border-radius:6px;border:1px solid var(--br);font-size:11px;background:transparent;cursor:pointer;color:var(--tx2)}
.cbar-wrap{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:.5px solid var(--br);font-size:12px}
.cbar-wrap:last-child{border-bottom:none}
.clbl{width:60px;color:var(--tx2);flex-shrink:0}
.cbar{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.cme{height:100%;border-radius:4px}
.cavg{position:absolute;top:0;height:100%;width:2px;background:#E24B4A}
.cval{width:26px;text-align:left;font-weight:600}
.cavgv{font-size:10px;color:var(--tx3);width:52px}
.toast-w{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast-w.show{opacity:1}
.view{display:none}.view.on{display:block}
.wcount{font-size:12px;color:var(--tx2);padding:4px 0 8px}
</style>
</head>

          <div id="pcons" style="margin-top:11px"></div>
        </div>
      </div>
    </div>
    <div id="v-alerts" class="view"><div class="card" id="alerts-card"></div></div>
  </div>
  <nav class="bnav">

    <button class="bni" id="bn-ai" onclick="goTo('ai',this)"><i class="ti ti-sparkles"></i><span>עוזר AI</span></button>
  </nav>
</div>

  const t=document.getElementById('main-sched');if(!t)return;
  const days=SHIFTS.slice(0,4);
  const types=['בוקר','שישי בוקר','שבת בוקר','צהריים','לילה','שישי לילה','שבת לילה'];
  const dc={בוקר:'#639922',צהריים:'#185FA5',לילה:'#534AB7','שישי בוקר':'#993556','שישי לילה':'#534AB7','שבת בוקר':'#993556','שבת לילה':'#534AB7'};
  const present=types.filter(st=>days.some(d=>d.shifts.some(s=>s.t===st)));
  let h='<thead><tr><th style="text-align:right;padding-right:8px">משמרת</th>';
  days.forEach(d=>{const isW=d.day==='שישי'||d.day==='שבת';h+=`<th style="${isW?'background:#FFF0F3':''}">${d.day}<br><span style="font-weight:400;font-size:9px">${d.date}</span></th>`;});
  h+='</tr></thead><tbody>';
  present.forEach(st=>{
    h+=`<tr><td style="padding:4px 6px;background:var(--bg2);font-weight:600;white-space:nowrap"><span style="width:5px;height:5px;border-radius:50%;background:${dc[st]};display:inline-block;margin-left:4px"></span>${st}</td>`;
    days.forEach(d=>{
      const s=d.shifts.find(x=>x.t===st);
      if(!s){h+='<td></td>';return;}
      const bg=s.full?'#F1F8E9':'#FFFDE7';
      h+=`<td style="background:${bg};vertical-align:top;padding:3px 3px">`;
      if(s.a)h+=`<span class="tag ta">★${s.a.n}</span>`;
      s.w.slice(0,3).forEach(w=>{const yc=w.y?{'צהוב':'ty','כחול':'tb','ורוד':'tp'}[w.y]:'te';h+=`<span class="tag ${yc}">${w.n}</span>`;});
      if(s.w.length>3)h+=`<span style="font-size:9px;color:#999">+${s.w.length-3}</span>`;
      h+=`<div style="font-size:9px;color:#999;margin-top:2px">${s.full?'✅':'🟡'}${(s.a?1:0)+s.w.length}</div></td>`;
    });
    h+='</tr>';
  });
  t.innerHTML=h+'</tbody>';
}

function renderDashMetrics(){
  document.getElementById('dash-metrics').innerHTML=`
    <div class="metric"><div class="ml">עובדים</div><div class="mv" style="color:#185FA5">51</div><div class="ms">22 אחמ"שים</div></div>
    <div class="metric"><div class="ml">קריטי</div><div class="mv" style="color:#3B6D11">0</div><div class="ms">השבוע</div></div>
    <div class="metric"><div class="ml">החלפות</div><div class="mv" style="color:#BA7517">1</div><div class="ms">ממתינת</div></div>
    <div class="metric"><div class="ml">התראות</div><div class="mv">2</div><div class="ms">פתוחות</div></div>`;
}

function renderWorkers(){
  const q=(document.getElementById('wsearch')||{value:''}).value;
  const ft=(document.getElementById('wtype')||{value:''}).value;
  const fy=(document.getElementById('wyacham')||{value:''}).value;
  const sel=WORKERS.filter(w=>{
    if(q&&!w.n.includes(q)&&!w.fn.includes(q))return false;
    if(ft&&w.t!==ft)return false;
    if(fy&&w.y!==fy)return false;
    return true;
  });
  document.getElementById('wcount').textContent=`${sel.length} עובדים`;
  document.getElementById('wgrid').innerHTML=sel.map(w=>{
    const tc=TS[w.t]||{bg:'#E6F1FB',fg:'#042C53'};
    const yb=YBG[w.y]||'#EAF3DE',yf=YFG[w.y]||'#173404';
    return `<div class="wcard"><div class="wct"><div class="wav" style="background:${yb};color:${yf}">${w.n.slice(0,2)}</div><div><div class="wname">${w.n}</div><div class="wrole">${w.r}${w.c?' 🔑':''}</div></div></div><span class="wtype" style="background:${tc.bg};color:${tc.fg}">${w.t}</span><div class="ws">${[['משמרות',w.s],['לילות',w.nl],['שעות',Math.round(w.h)]].map(([l,v])=>`<div class="wst"><div class="wsv">${v}</div><div class="wsl">${l}</div></div>`).join('')}</div></div>`;
  }).join('');
}

function initPortal(){
  const pick=document.getElementById('ppick');
  if(!pick.options.length){
    WORKERS.forEach(w=>{const o=document.createElement('option');o.value=w.n;o.textContent=`${w.n} — ${w.r}${w.y?', יח"מ '+w.y:''}, ${w.t}`;pick.appendChild(o);});
  }
  renderPortal(pick.value||WORKERS[0].n);
}

function renderPortal(name){
  const w=WORKERS.find(x=>x.n===name)||WORKERS[0];
  document.getElementById('ppick').value=w.n;
  const yb=YBG[w.y]||'#EAF3DE';
  document.getElementById('pmetrics').innerHTML=`
    <div class="metric"><div class="ml">משמרות</div><div class="mv" style="color:#185FA5">${w.s}</div><div class="ms">ממוצע: ${w.avg_s}</div></div>
    <div class="metric"><div class="ml">לילות</div><div class="mv" style="color:#534AB7">${w.nl}</div><div class="ms">ממוצע: ${w.avg_n}</div></div>
    <div class="metric"><div class="ml">שעות</div><div class="mv">${Math.round(w.h)}</div><div class="ms">ממוצע: ${Math.round(w.avg_s*7.5)}</div></div>
    <div class="metric"><div class="ml">פגרות</div><div class="mv" style="color:#3B6D11">${w.t==='שח"מ'?2:0}</div><div class="ms">שנצברו</div></div>`;
  let sh='';
  (w.shifts||[]).forEach(s=>{
    const tkey=s.t.startsWith('אילוץ')?'בוקר':s.t;
    const sc2=SC[tkey]||{bg:'#f5f5f5',fg:'#333'};
    const isOff=s.t.startsWith('אילוץ')||s.t==='פגרה';
    sh+=`<div class="srow"><div class="sd8"><div class="sday">${s.day.slice(0,3)}</div><div class="snum">${s.d.split('/')[0]}</div></div><div class="si"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span class="spill" style="background:${isOff?'#FAEEDA':sc2.bg};color:${isOff?'#412402':sc2.fg}">${s.t}</span>${s.hrs!=='—'?`<span class="shrs">${s.hrs}</span>`:''}</div>${s.w1?`<div class="why ${s.w1.c}"><i class="ti ${s.w1.i}"></i>${s.w1.txt}</div>`:''}</div></div>`;
  });
  document.getElementById('pv0').innerHTML=sh||'<div style="padding:14px;text-align:center;font-size:12px;color:#999">אין נתונים</div>';
  const rows=[{l:'משמרות',me:w.s,avg:w.avg_s,c:'#185FA5'},{l:'לילות',me:w.nl,avg:w.avg_n,c:'#534AB7'},{l:'שעות',me:Math.round(w.h),avg:Math.round(w.avg_s*7.5),c:'#639922'}];
  const diff=w.s-w.avg_s;
  const st=Math.abs(diff)<1.5?'<span style="color:#3B6D11">במרכז הטווח</span>':diff>0?`<span style="color:#BA7517">מעל ממוצע</span>`:`<span style="color:#185FA5">מתחת לממוצע</span>`;
  let cp=`<div style="font-size:12px;padding:7px 9px;background:#f5f5f5;border-radius:8px;margin-bottom:10px">את/ה ${st}.</div>`;
  rows.forEach(r=>{const max=Math.max(r.me,r.avg)*1.15;const mp=Math.min((r.me/max)*100,100);const ap=Math.min((r.avg/max)*100,100);cp+=`<div class="cbar-wrap"><div class="clbl">${r.l}</div><div class="cbar"><div class="cme" style="width:${mp.toFixed(1)}%;background:${r.c}"></div><div class="cavg" style="right:${(100-ap).toFixed(1)}%"></div></div><div class="cval">${r.me}</div><div class="cavgv">ממוצע: ${Number.isInteger(r.avg)?r.avg:r.avg.toFixed(1)}</div></div>`;});
  document.getElementById('pcomp').innerHTML=cp;
  const all=[...(w.cons||[]),...(pCons[w.n]||[])];
  document.getElementById('pcons').innerHTML=all.length?'<div style="font-size:12px;font-weight:600;color:#666;margin-bottom:5px">אילוצים שהגשת:</div>'+all.map(c=>`<div style="display:flex;align-items:center;gap:7px;padding:7px 9px;background:#f5f5f5;border-radius:8px;margin-bottom:4px;font-size:12px"><i class="ti ti-clock" style="color:#BA7517;font-size:15px"></i><span style="font-weight:600">${c.d||c.date}</span><span>${c.r||c.reason}</span><span style="margin-right:auto;font-size:10px;padding:1px 6px;border-radius:8px;background:#FAEEDA;color:#412402">ממתין</span></div>`).join(''):'<div style="font-size:12px;color:#999;margin-top:7px">אין אילוצים פתוחים</div>';
}

function pTab(i){[0,1,2].forEach(j=>{document.getElementById('pv'+j).style.display=j===i?'block':'none';document.getElementById('pt'+j).classList.toggle('on',j===i);});}

function submitCon(){
  const name=document.getElementById('ppick').value;
  const dt=document.getElementById('pdt').value;
  const r=document.getElementById('prs').value;
  const d=dt.split('-').reverse().slice(0,2).join('/');
  if(!pCons[name])pCons[name]=[];
  pCons[name].push({d,r});
  const w=WORKERS.find(x=>x.n===name);
  if(w)renderPortal(w.n);
  showToast('האילוץ נשמר!');
}

function renderAlerts(){
  const icons={constraint:'ti-clock',swap:'ti-arrows-exchange',shortage:'ti-alert-triangle'};
  const colors={constraint:'#185FA5',swap:'#BA7517',shortage:'#A32D2D'};
  document.getElementById('alerts-card').innerHTML=ALERTS.map(a=>`<div class="aitem" style="opacity:${a.read?.6:1}"><i class="ti ${icons[a.type]}" style="color:${colors[a.type]}"></i><div style="flex:1"><div class="atxt">${a.msg}</div><div class="asub">${a.sub}</div>${!a.read?`<button class="ardbtn" onclick="readAlert(${a.id})">סמן כנקרא</button>`:''}</div></div>`).join('');
  document.getElementById('abadge').textContent=ALERTS.filter(a=>!a.read).length;
}

function readAlert(id){const a=ALERTS.find(x=>x.id===id);if(a)a.read=true;renderAlerts();}
function showToast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

const AI_CTX = `נתוני סידור יולי 2026: 51 עובדים (22 אחמ"שים). יח"מ צהוב/כחול/ורוד. ממוצע: 17.5 משמרות, 7.5 לילות. חוסרים: שישי לילה 04/07 (5/6), שבת לילה 05/07 (5/6). עמוסים: אגם (19 משמרות), הלל/טל/לב אנה/תפארת (18 כל אחד). שח"מ עובדים שבתות ומקבלים פגרות. בש"ל לא עובדות שישי/שבת.`;

async function aiSend(){
  const inp=document.getElementById('ai-inp');
  const q=inp.value.trim();if(!q)return;
  inp.value='';
  const msgs=document.getElementById('ai-msgs');
  msgs.innerHTML+=`<div style="padding:8px 10px;border-radius:10px;font-size:12px;background:var(--p);color:#fff;align-self:flex-start;max-width:90%;line-height:1.5">${q}</div>`;
  msgs.innerHTML+=`<div id="ai-typing" style="padding:8px 10px;border-radius:10px;font-size:12px;background:var(--bg2);align-self:flex-end;max-width:60%;color:var(--tx2)">חושב...</div>`;
  msgs.scrollTop=msgs.scrollHeight;
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,
        system:`אתה עוזר AI לקמב"צ שמנהל מוקד. ענה בעברית, קצר וממוקד (2-3 משפטים). השתמש בנתונים האמיתיים. הזכר שמות ספציפיים.`,
        messages:[{role:"user",content:AI_CTX+"\n\nשאלה: "+q}]})
    });
    const d=await resp.json();
    const ans=d.content?.[0]?.text||"שגיאה בתשובה";
    document.getElementById('ai-typing')?.remove();
    msgs.innerHTML+=`<div style="padding:8px 10px;border-radius:10px;font-size:12px;background:var(--bg2);align-self:flex-end;max-width:90%;line-height:1.5">${ans}</div>`;
  }catch(e){
    document.getElementById('ai-typing')?.remove();
    msgs.innerHTML+=`<div style="padding:8px 10px;border-radius:10px;font-size:12px;background:var(--bg2);align-self:flex-end;max-width:90%;line-height:1.5;color:#A32D2D">שגיאת חיבור. בדקי חיבור אינטרנט.</div>`;
  }
  msgs.scrollTop=msgs.scrollHeight;
}
function aiAsk(q){document.getElementById('ai-inp').value=q;aiSend();}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}

renderDashMetrics();
buildSched();
</script>
